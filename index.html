<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes - Create and Manage Your Notes</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="app-header">
    <div class="header-container">
      <h1>Quick Notes</h1>
      <p>Capture, search, edit, rearrange and delete your notes.</p>
    </div>
  </header>

  <main class="main-container">
    <section id="add-section" class="card" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a Note</h2>

      <form id="note-form" novalidate>
        <div class="form-group">
          <label for="note-input">Note</label>
          <textarea id="note-input" name="note" rows="8" placeholder="Write your note here... a sentence, a paragraph, or more."></textarea>
        </div>

        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category" name="category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="ideas">Ideas</option>
            <option value="school">School</option>
          </select>
        </div>

        <button type="submit" class="btn submit-btn">Add Note</button>
      </form>
      <p id="error-message" role="alert" aria-live="assertive"></p>
    </section>

    <section id="notes-section" class="card" aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your Notes</h2>

      <div class="form-group search-group">
        <label for="search-input">Search notes</label>
        <input type="search" id="search-input" name="search" placeholder="Search saved notes..." autocomplete="off">
      </div>

      <p id="note-count" aria-live="polite">0 notes</p>

      <ul id="notes-list"></ul>
    </section>

  </main>

  <footer class="app-footer">
    <div class="footer-container">
      <p>
        &copy; 2026 Quick Notes
        &bull;
        <a href="#privacy">Privacy</a>
        &bull;
        <a href="#terms">Terms</a>
        &bull;
        <a href="#help">Help</a>
      </p>
    </div>
  </footer>

  <template id="note-template">
    <li class="note-item">
      <span class="note-text"></span>
      <span class="note-category"></span>
      <div class="note-actions">
        <button type="button" class="btn move-up" aria-label="Move note up">&uarr;</button>
        <button type="button" class="btn move-down" aria-label="Move note down">&darr;</button>
        <button type="button" class="btn edit-btn">Edit</button>
        <button type="button" class="btn delete-btn">Delete</button>
      </div>
    </li>
  </template>

  <script src="script.js"></script>
</body>

</html>
